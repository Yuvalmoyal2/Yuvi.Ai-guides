<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>גלגל המזל של הפלופים</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        
        body {
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            background-color: #ffffff; /* רקע לבן ונקי */
            font-family: 'Heebo', sans-serif;
            color: #2c3e50;
        }

        h1 {
            font-size: 2.3rem;
            margin-bottom: 2.5vh;
            text-align: center;
            font-weight: 900;
            color: #1a1a1a;
            padding: 0 10px;
            letter-spacing: -0.5px;
        }

        .wheel-container {
            position: relative;
            width: 90vw;
            max-width: 360px;
            height: 90vw;
            max-height: 360px;
            margin-bottom: 25px;
            z-index: 10;
        }

        /* חץ ההצבעה - יושב בדיוק באמצע העליון */
        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 38px solid #1a1a1a;
            z-index: 100;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.3));
        }

        /* מסגרת נקייה סביב הגלגל */
        .wheel-border {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 8px;
            background: #f8f9fa;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 2px solid #e9ecef;
            position: relative;
        }

        /* תאורה עדינה מאוד מסביב */
        .lights {
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border-radius: 50%;
            border: 3px dotted #dee2e6;
            animation: lightsFlash 1.5s steps(2, start) infinite;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes lightsFlash {
            0% { border-color: #ced4da; }
            50% { border-color: #ffffff; }
        }

        /* אזור הסיבוב המרכזי */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #fff;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.15);
            direction: ltr; /* קריטי לדיוק המעלות במובייל */
        }

        .spin-layer {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4.5s cubic-bezier(0.15, 0.85, 0.15, 1);
            /* תמיד מתחיל מ-0, החישוב המתמטי מסתמך על זה */
            transform: rotate(0deg); 
        }

        /* כפתור הסיבוב */
        .center-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: #ffffff;
            border: 4px solid #1a1a1a;
            border-radius: 50%;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a1a1a;
            font-weight: 900;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            user-select: none;
            transition: transform 0.1s, background 0.2s;
        }
        
        .center-button:active {
            transform: translate(-50%, -45%) scale(0.95);
            background: #f1f3f5;
        }

        /* יישור אבסולוטי של הטקסט מהאמצע לקצה */
        .segment-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50%; 
            height: 0px;
            display: flex;
            align-items: center;
            justify-content: flex-end; 
            padding-right: 20px; 
            transform-origin: 0 0; 
        }

        .segment-text {
            direction: rtl;
            text-align: right;
            line-height: 1.15;
            white-space: nowrap;
            font-weight: 800;
        }

        /* מחלקות לשליטה בקריאות הטקסט */
        .text-dark {
            color: #1a1a1a;
        }

        .text-light {
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5), 0 0 6px rgba(0,0,0,0.2);
        }

        /* תצוגת התוצאה למטה */
        .result-box {
            position: relative;
            margin-top: 2vh;
            background: #ffffff;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 15px 20px;
            min-width: 280px;
            max-width: 90vw;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            z-index: 10;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-text {
            font-size: 1.4rem;
            font-weight: 800;
            color: #1a1a1a;
            margin: 0;
            line-height: 1.3;
            transition: color 0.3s;
        }

        @media (max-height: 700px) {
            h1 { font-size: 1.9rem; margin-bottom: 2vh; }
            .result-box { margin-top: 1vh; padding: 12px 15px; }
            .result-text { font-size: 1.25rem; }
            .center-button { width: 70px; height: 70px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <h1>גלגל המזל של הפלופים</h1>
    
    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel-border">
            <div class="lights"></div>
            <div class="wheel">
                <div class="spin-layer" id="spin-layer"></div>
            </div>
            <div class="center-button" id="spin-btn">סובב</div>
        </div>
    </div>
    
    <div class="result-box">
        <div class="result-text" id="result-output">מי מסובב ראשון?</div>
    </div>

    <script>
        const spinLayer = document.getElementById('spin-layer');
        const spinBtn = document.getElementById('spin-btn');
        const outputText = document.getElementById('result-output');

        // הרשימה המדויקת של האופציות עם הודעות הזכייה המותאמות והעיצוב לכל אחת
        const segments = [
            { text: "K 🐴", bg: "#87CEFA", textTheme: "text-dark", msg: "החללית מחכה לכם…" }, 
            { text: "העבר תור<br>לחבר", bg: "#f78c6b", textTheme: "text-light", msg: "העבר תור לחבר" },
            { text: "קוק 👃", bg: "#ffffff", textTheme: "text-dark", msg: "יצאתם סחים" }, 
            { text: "בלבל את<br>האויב (MK)", bg: "#ef476f", textTheme: "text-light", msg: "כשכלום לא נפתח צריך להיות מקוריים." },
            { text: "mmc 💥", bg: "#FFF59D", textTheme: "text-dark", msg: "קצת שורף מה אתם בוכים?" }, 
            { text: "סובב<br>שוב", bg: "#9d4edd", textTheme: "text-light", msg: "אולי הפעם תקבל בדיוק את מה שרציתם" },
            { text: "X 💊", bg: "#00BFFF", textTheme: "text-light", msg: "בהצלחה לכל המשתתפים." }, 
            { text: "הענק באמפ<br>לבחירתך", bg: "#ff9f1c", textTheme: "text-light", msg: "הענק באמפ לבחירתך<br>למי בא לך לפרגן?" },
            { text: "w 🌿", bg: "#4CAF50", textTheme: "text-light", msg: "אין כמו שאכטה טובה להוריד את הלחץ" } 
        ];
        
        const numSegments = segments.length;
        const sliceAngle = 360 / numSegments; // בדיוק 40 מעלות לכל פלח

        // בניית ציור הרקע (מסובב לאחור בחצי פלח, כדי שהפלח הראשון יישב בדיוק מול החץ)
        let gradientParts = [];
        segments.forEach((seg, index) => {
            let startAngle = index * sliceAngle;
            let endAngle = (index + 1) * sliceAngle;
            gradientParts.push(`${seg.bg} ${startAngle}deg ${endAngle}deg`);
        });
        spinLayer.style.background = `conic-gradient(from -20deg, ${gradientParts.join(', ')})`;

        // הזרקת הטקסטים לזווית המתאימה בדיוק
        segments.forEach((seg, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'segment-wrapper';
            
            // חישוב הזווית - 90 מעלות הפחתה מסנכרנת את ציר ה-X מול נקודת העליון (0 מעלות)
            const angle = (index * sliceAngle) - 90;
            wrapper.style.transform = `rotate(${angle}deg)`;

            const textEl = document.createElement('div');
            textEl.className = `segment-text ${seg.textTheme}`;
            textEl.innerHTML = seg.text;
            
            // התאמה דינמית של גודל הפונט
            if (seg.text.includes('<br>')) {
                textEl.style.fontSize = "0.95rem";
            } else {
                textEl.style.fontSize = "1.2rem";
            }
            
            wrapper.appendChild(textEl);
            spinLayer.appendChild(wrapper);
        });

        let currentRotation = 0;
        let isSpinning = false;

        // אפקט קונפטי לחגיגת הזכייה
        function fireConfetti() {
            const colors = ['#3498db', '#e74c3c', '#2ecc71', '#f1c40f', '#9b59b6', '#ffffff'];
            for(let i=0; i<45; i++) {
                let conf = document.createElement('div');
                conf.style.position = 'absolute';
                conf.style.width = '10px';
                conf.style.height = '10px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = '50%';
                conf.style.top = '50%';
                conf.style.zIndex = '1000';
                conf.style.pointerEvents = 'none';
                conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                conf.style.boxShadow = "0 2px 5px rgba(0,0,0,0.1)";
                document.body.appendChild(conf);

                let angle = Math.random() * Math.PI * 2;
                let velocity = 50 + Math.random() * 110;
                let tx = Math.cos(angle) * velocity;
                let ty = Math.sin(angle) * velocity - 150; 

                conf.animate([
                    { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) rotate(${Math.random()*360}deg)`, opacity: 1, offset: 0.5 },
                    { transform: `translate(${tx + (Math.random()-0.5)*100}px, ${ty + 250}px) rotate(${Math.random()*720}deg)`, opacity: 0 }
                ], {
                    duration: 1500 + Math.random() * 1000,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
                });

                setTimeout(() => conf.remove(), 2500);
            }
        }

        // פונקציית הלחיצה
        function triggerSpin() {
            if (isSpinning) return;
            isSpinning = true;
            
            outputText.innerText = "מגלגלים...";
            outputText.style.color = "#95a5a6";

            // יצירת מספר סיבובים אקראי (בין 5 ל-9 סיבובים שלמים) וזווית סופית
            const randomSpins = Math.floor(Math.random() * 4) + 5; 
            const randomDegrees = Math.floor(Math.random() * 360);
            
            currentRotation += (360 * randomSpins) + randomDegrees;
            spinLayer.style.transform = `rotate(${currentRotation}deg)`;

            // השהייה עד שהאנימציה נגמרת
            setTimeout(() => {
                isSpinning = false;
                
                // --- מנוע בחירת הזוכה הוודאי והמדויק ---
                // איפה נמצאת הזווית של החץ עכשיו ביחס לסיבוב הכללי?
                const normalizedAngle = (360 - (currentRotation % 360)) % 360;
                // חישוב מתמטי טהור (עיגול לחלק הקרוב ביותר של 40 מעלות)
                const winningIndex = Math.round(normalizedAngle / sliceAngle) % numSegments;
                
                const winningSegment = segments[winningIndex];
                
                // הדפסת הטקסט
                outputText.innerHTML = winningSegment.msg; 
                
                // שינוי צבע כדי להתאים במידה
                if (winningSegment.bg === "#ffffff" || winningSegment.bg === "#FFF59D") {
                    outputText.style.color = "#1a1a1a"; 
                } else {
                    outputText.style.color = winningSegment.bg;
                }

                // הפעלת האנימציה
                fireConfetti();
                
            }, 4500); 
        }

        spinBtn.addEventListener('click', triggerSpin);

    </script>
</body>
</html>
