<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רשימת ההמתנה לקורס | Yuvi.AI</title>
<meta name="description" content="רשימת ההמתנה לקורס של Yuvi.AI, ועדכון ראשון על הסדנה הקרובה.">
<meta property="og:title" content="רשימת ההמתנה לקורס | Yuvi.AI">
<meta property="og:description" content="תהיו הראשונים לשמוע על הקורס ועל הסדנה הקרובה.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
/* Design only. Version 1, in the guides' look (dark ink, warm white, turquoise). The landing-page design comes later
   and replaces this file; the signup logic lives in waitlist.js and stays. Copy is a placeholder until the content brain sets it. */
:root{--ink:#1D1813;--ink-2:#2A221C;--white:#F7F2EA;--line:rgba(247,242,234,.09);--turq:#16C7B0;--hl:#F6FF1F;--muted:#A99C8E;--err:#FF8A7A}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--ink);color:var(--white);font-family:"Rubik",system-ui,Arial,sans-serif;font-size:17px;line-height:1.7;display:grid;place-items:center;padding:28px 16px}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px),
  linear-gradient(rgba(22,199,176,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(22,199,176,.07) 1px,transparent 1px);
  background-size:32px 32px,32px 32px,160px 160px,160px 160px;
  -webkit-mask-image:radial-gradient(120% 80% at 50% 20%,#000 30%,transparent 85%);mask-image:radial-gradient(120% 80% at 50% 20%,#000 30%,transparent 85%)}
main{position:relative;z-index:1;width:100%;max-width:520px}
.brand{display:inline-flex;gap:10px;align-items:center;direction:ltr;text-decoration:none;color:inherit;font-weight:800;font-size:18px}
.brand img{width:40px;height:40px;border-radius:50%}
.brand span{border-bottom:2px solid var(--turq);line-height:1.2}
.card{margin-top:22px;background:var(--ink-2);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:34px 28px;box-shadow:0 40px 80px -40px #000}
.soon{display:inline-block;background:var(--turq);color:var(--ink);font-weight:800;font-size:13px;letter-spacing:.06em;border-radius:999px;padding:3px 13px}
h1{font-family:"Secular One","Rubik",sans-serif;font-weight:400;font-size:clamp(32px,7vw,44px);line-height:1.1;margin:14px 0 10px}
.lead{color:#E6DCCD;margin:0 0 24px}
label{display:block;font-weight:500;margin:0 0 6px}
label small{color:var(--muted);font-weight:400}
input{width:100%;font:inherit;color:var(--white);background:var(--ink);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;margin-bottom:16px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--turq)}
input[type=email],input[type=tel]{direction:ltr;text-align:right}
.ig{position:relative}
.ig input{direction:ltr;text-align:left;padding-left:34px}
.ig::before{content:"@";position:absolute;left:14px;top:12px;color:var(--muted)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:-4px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}
/* hidden without an off-screen offset: in a right-to-left page, left:-9999px makes the whole page scroll sideways */
.trap{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
button{width:100%;font:inherit;font-weight:700;font-size:18px;background:var(--turq);color:var(--ink);border:0;border-radius:999px;padding:14px 22px;cursor:pointer;margin-top:6px;transition:transform .2s;box-shadow:0 12px 26px -14px var(--turq)}
button:hover{transform:translateY(-2px)}
button:disabled{opacity:.6;cursor:wait;transform:none}
#waitlist-msg{color:var(--err);margin:12px 0 0;font-weight:500}
#waitlist-done h2{font-family:"Secular One","Rubik",sans-serif;font-weight:400;font-size:30px;margin:6px 0 8px;color:var(--hl)}
.fine{color:var(--muted);font-size:14px;margin:18px 0 0}
</style>
</head>
<body>
<div class="grid"></div>
<main>
  <a class="brand" href="https://www.instagram.com/yuvi.ai1/" target="_blank" rel="noopener"><img src="logo.png" alt="Yuvi.AI"><span>Yuvi.AI</span></a>

  <div class="card">
    <span class="soon">בקרוב</span>
    <h1>רשימת ההמתנה לקורס</h1>
    <p class="lead">השאירו מייל או טלפון, ותהיו הראשונים לשמוע על הקורס, ולקבל עדכון ראשון על הסדנה הקרובה.</p>

    <form id="waitlist-form" novalidate>
      <label for="email">מייל</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com">
      <div class="or">או</div>
      <label for="phone">טלפון</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="050-0000000">
      <label for="instagram">אינסטגרם <small>(לא חובה)</small></label>
      <div class="ig"><input id="instagram" name="instagram" type="text" autocomplete="off" placeholder="your.handle"></div>
      <div class="trap" aria-hidden="true"><label for="website">אתר</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
      <button type="submit">אני רוצה לשמוע ראשון ←</button>
      <p id="waitlist-msg" role="alert" hidden></p>
    </form>

    <div id="waitlist-done" hidden>
      <h2>נרשמתם ✓</h2>
      <p class="lead">אעדכן אתכם ראשונים. בינתיים, כל המדריכים החדשים עולים ב-<a href="https://www.instagram.com/yuvi.ai1/" target="_blank" rel="noopener" style="color:var(--turq)">@yuvi.ai1</a>.</p>
    </div>

    <p class="fine">הפרטים משמשים רק לעדכונים על הקורס ועל הסדנה. אפשר לבקש להוריד אותם בכל רגע.</p>
  </div>
</main>
<script src="waitlist.js"></script>
</body>
</html>
